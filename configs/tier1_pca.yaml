# Tier-1: Prostate Cancer Triage & Enrichment

pipeline_tier: 1
pipeline_name: "PCa_Triage_GoldStandard"

discovery:
  mode: KEYWORD
  queries:
    - >
      ("Prostatic Neoplasms"[MeSH Terms]
      OR prostate[tiab]
      OR prostatic[tiab]
      OR "prostate cancer"[tiab])
      AND
      ("spatial transcriptom*"[tiab] OR "spatial gene expression"[tiab]
      OR "spatial multiomic*"[tiab] OR "spatial omics"[tiab]
      OR "spatial multi-omics"[tiab]
      OR Visium[tiab] OR Xenium[tiab] OR CosMx[tiab] OR GeoMx[tiab]
      OR "Slide-seq"[tiab] OR "SlideSeq"[tiab]
      OR "spatial ATAC"[tiab] OR "spatial-ATAC"[tiab]
      OR "single-cell"[tiab] OR "single cell"[tiab]
      OR "single-nucleus"[tiab] OR "single nucleus"[tiab]
      OR scRNA*[tiab] OR snRNA*[tiab] OR scATAC*[tiab] OR snATAC*[tiab]
      OR multiome[tiab] OR "10x multiome"[tiab]
      OR pseudotime[tiab] OR "trajectory inference"[tiab] OR "RNA velocity"[tiab])
      AND ("Journal Article"[pt]
      NOT "Review"[pt]
      NOT "Editorial"[pt]
      NOT "Comment"[pt]
      NOT "Letter"[pt]
      NOT "News"[pt]
      NOT "Case Reports"[pt])
      AND english[la]
      NOT "Preprint"[Publication Type]
  retmax: 30
  reldays: 365

ai:
  provider: gemini
  # This file is the ONLY source of truth for models and thinking effort.
  # There are no environment-variable overrides -- edit the values here.
  model_default: "gemini-3.7-flash"          # Base fallback for all tasks
  thinking_default: "MEDIUM"

  # Task-driven configuration: model and thinking effort per task
  tasks:
    pass1_fulltext:
      model: "gemini-3.7-flash"
      thinking: "HIGH"                       # Full-text scoring & evidence extraction
    pass1_abstract:
      model: "gemini-3.7-flash"
      thinking: "MEDIUM"                     # Abstract-only scoring (cache-optimized)
    pass2_methods:
      model: "gemini-3.7-flash"
      thinking: "HIGH"                       # Structured bioinfo methods extraction
    tier_c_engine:
      model: "gemini-3.7-flash"
      thinking: "HIGH"                       # 3-stage multimodal figure & story-map engine
    tier_c_identity:
      model: "gemini-3.7-flash"
      thinking: "LOW"                        # Page-1 quick identity & PMID resolution
    rag_agent:
      model: "gemini-3.7-flash"
      thinking: "MEDIUM"                     # Vertex RAG conversational query agent
    escalation:
      model: "gemini-3.7-flash"
      thinking: "HIGH"                       # Escalation retry on malformed JSON

  pass2_min_score: 88                 # Trigger threshold for Pass 2 (score >= 88)
  max_chars: 80000
  prompt_template: "tier1_pca"
  escalation_triggers:
    score_range: [70, 79]       # H2: Ambiguous relevance range
    min_rationale_length: 50    # H1: Short rationale threshold
    escalate_on_high_reuse: 4   # H4: High Reuse Score
    h3_high_score_thresh: 80    # H3: High score threshold for mismatch check
    h3_low_score_thresh: 70     # H3: Low score threshold for mismatch check
    escalate_min_score: 87      # H5: Direct escalation for High Tier 3+ (Score >= 88)


    # Upfront escalation (Handled by Two-Pass Logic now)
    # min_chars: removed - implies Pass 1 Full Text mode
    # min_modalities: removed - implies Pass 1 Full Text mode

    # Behavior
    retry_on_error: true        # Malformed JSON -> retry with mini

storage:
  notion:
    enabled: true
    database_id_env: "NOTION_DB_ID"
  drive:
    enabled: true
    papers_jsonl_file_id_env: "GOOGLE_DRIVE_PAPERS_JSONL_FILE_ID"
    notebooklm_folder_id_env: "GOOGLE_DRIVE_NOTEBOOKLM_FOLDER_ID"
    methods_folder_id_env: "GOOGLE_DRIVE_COMP_METHODS_FOLDER_ID"
    upload_pdfs: true
    pdf_min_score: 88
    pdf_folder_name: "PDFs"
    pdf_folder_id_env: "GOOGLE_DRIVE_PDF_FOLDER_ID"
  csv:
    enabled: true
    filename: "papers_tier1.csv"

dedup:
  keys: ["DOI", "PMID"]

tier_c:
  enabled: true
  model: "gemini-3.7-flash"
  thinking: "HIGH"
  min_score: 90                                # auto path: only papers >= this score with a PMC OA PDF
  inbox_folder_id_env: "GOOGLE_DRIVE_TIERC_INBOX_FOLDER_ID"
  output_folder_id_env: "GOOGLE_DRIVE_TIERC_OUTPUT_FOLDER_ID"
  process_inbox_in_cron: true
  max_size_mb: 18.0
  chunk_pages: 25
  max_chunks: 4
  identity_model: "gemini-3.7-flash"

# --- Vertex RAG corpus sync + NL query agent (agent/cli.py) ---
# Resource IDs (VERTEX_RAG_CORPUS_NAME, GCP_PROJECT_ID) stay in .env -- they are
# deployment credentials. Every model / tuning knob is here.
rag_agent:
  model: "gemini-3.7-flash"
  thinking: "MEDIUM"                  # NONE | LOW | MEDIUM | HIGH
  location: "us-east5"             # Vertex location for LLM inference
  top_k: 10                        # RAG chunks retrieved per question
  vector_distance_threshold: 0.5
  min_score: 85                    # min RelevanceScore to ingest into the corpus

# Points at the agent worktree, not the trunk. Chapter generation is agent-driven
# and trunk_write_guard.sh blocks agent writes into a trunk; pointing here keeps
# one isolation rule instead of two. Land with:
#   git -C ~/GitHub/dotfiles merge --ff-only claude
methods_repo_path: "~/GitHub/dotfiles-claude/skills/bioinfo-methods"
