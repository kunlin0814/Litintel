[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-intel"
version = "0.2.0"
description = "Production-grade literature intelligence pipeline for computational oncology"
readme = "README.md"
authors = [{ name = "Antigravity", email = "agent@deepmind.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "google-generativeai==0.8.5",
    "google-genai>=1.0.0",
    "openai==2.11.0",
    "notion-client",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pandas",
    "pyyaml",
    "typer",
    "rich",
    "pydantic>=2.0.0",
    "google-cloud-aiplatform>=1.49.0",
    "google-adk>=0.3.0",
    "pypdf>=4.0",
    "Pillow>=10.0",
    "requests==2.32.4",
    # >=1 required by google-adk; the old requirements.txt pin (0.21.0) was
    # incompatible with it, so the two install paths silently contradicted.
    "python-dotenv>=1,<2"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest==7.4.0"]

[project.scripts]
litintel = "litintel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", "venv", ".git", ".pytest_cache"]
